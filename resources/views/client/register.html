{% include 'includes/header.html' %}
<title>New Client | EkiCal</title>
<body>

<div>
    <h2>New Client</h2>
</div>
        <!-- Message alerte-->
<div>
        {% if errors() %}
        <div>
            <ul>
                {% for error in errors() %}
                <li class="alert">{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
        {%endif%}
</div>

        <!-- Formulaires Actions-->
<form action="{{ route('clients.request') }}" method="POST" novalidate>
            <div>
                {{ csrf_field() | raw }}
                <label>Nom complet
                    <input name="name" size="50" type="text" value="{{ old('name') }}">
                </label>
                <label>Adresse e-mail
                    <input name="email" size="50" type="email" value="{{ old('email') }}">
                </label>
                <label>N° TVA
                    <input name="tva" size="50" type="text">
                </label>
                <label>Téléphone
                    <input name="phone" size="50" type="text">
                </label>
            </div>
            <button type="submit">Enregistrer</button>
        </form>

</body>
</html>
