{% include 'includes/header.html' %}
<title>Poneys register | EkiCal</title>
<body>

  <div>
    <div>
      <h2>Nouveau Poney</h2>
    </div>

    <!-- Message alerte-->
<div>
    {% if errors() %}
    <div>
      <ul>
        {% for error in errors() %}
          <li class="alert">{{ error }}</li>
        {% endfor %}
      </ul>
    </div>
    {%endif%}
</div>

    <!-- Formulaires Actions-->
<div>
    <form action="{{ route('poney.request') }}" method="POST" novalidate>
      <div>
        {{ csrf_field() | raw }}
        <label>Nom du poney
          <input name="name"  type="text" value="{{ old('name') }}">
        </label>
        <label>Temps de travail
          <input name="tps_w"  type="text" value="{{ old('tps_w') }}" >
        </label>
        <label>Poids
          <input name="weight"  type="text" >
        </label>
        <label> Date de naissance
          <input name="birth"  type="date">
        </label>
        <label>Visite médicale
          <input name="medicalVisit"  type="date">
        </label>
      </div>
      <button type="submit">Enregistrer</button>
    </form>
  </div>
</div>

</body>
</html>
