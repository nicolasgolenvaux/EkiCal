<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | Ekical</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="antialiased">
<div class="joinus">
  <div class="">
    <div class="">
      <a href="{{route('index')}}" class="">
      </a>
      <h2 class="">
        Heureux de vous revoir !
      </h2>
      <p class="">
        Entrez vos données de connexion
      </p>
    </div>
    {% if errors() %}
    <div class="">
      <div class="">
        <div class="">

        </div>
        <div class="">
          <p class="alert">
            {{ errors()[0]}}
          </p>
        </div>
      </div>
    </div>
    {% endif %}
    <form action="{{ route ('login.request') }}" method="POST" class="" novalidate>
      <div class="">
        {{  csrf_field() | raw}}
        <input name="email" type="email" value="{{old('email')}}" placeholder="Adresse e-mail" class="">
        <input name="password" type="password" placeholder="Mot de passe" class="">
      </div>
      <button type="submit" class="">
        Connexion
      </button>
    </form>
  </div>
</div>
</body>
</html>
